<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tantramour 2026 — Informations Ateliers</title>
  <script src="ref_translations.js"></script>
  <script src="i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <style>
    :root {
      --bg:#ffffff; --surface:#f7f8fa; --border:#e5e7eb;
      --text:#1f2328; --muted:#57606a; --accent:#3b82d4;
      --green:#16a34a; --green-bg:#dcfce7; --green-border:#86efac;
      --orange:#ca8a04; --orange-bg:#fef9c3; --orange-border:#fde68a;
      --purple:#7c3aed; --purple-bg:#f5f3ff; --purple-border:#c4b5fd;
      --fr-bg:#eff6ff; --fr-border:#bfdbfe;
      --en-bg:#f0fdf4; --en-border:#bbf7d0;
      --tag-bg:#f0f4ff; --tag-text:#3b5bdb;
      --ws-hdr-bg:#fefce8; --ws-hdr-border:#fde68a; --ws-hdr-text:#854d0e;
    }
    .dark {
      --bg:#0d1117; --surface:#161b22; --border:#30363d;
      --text:#e6edf3; --muted:#8b949e;
      --green:#4ade80; --green-bg:#052e16; --green-border:#166534;
      --purple-bg:#1e1438; --purple-border:#6d28d9;
      --fr-bg:#0c2d48; --fr-border:#1e4976;
      --en-bg:#052e16; --en-border:#166534;
      --tag-bg:#1c2444; --tag-text:#93b4fb;
      --ws-hdr-bg:#2d2500; --ws-hdr-border:#92400e; --ws-hdr-text:#fcd34d;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,"Segoe UI",system-ui,sans-serif; font-size:14px; line-height:1.6; background:var(--bg); color:var(--text); transition:background .2s,color .2s; }
    .wrap { max-width:900px; margin:0 auto; padding:24px 20px 80px; }

    /* ── HEADER ── */
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:12px; }
    .logo h1 { font-size:19px; font-weight:700; }
    .logo p  { font-size:20px; font-weight:800; color:var(--accent); line-height:1.2; margin-top:2px; }
    .header-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .btn { cursor:pointer; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:7px 14px; font-size:13px; color:var(--text); font-family:inherit; display:inline-flex; align-items:center; gap:6px; text-decoration:none; transition:background .15s; }
    .btn:hover { background:var(--border); }
    .btn-sm { padding:5px 10px; font-size:12px; }

    /* ── FILTRES ── */
    .filters-panel { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:18px; }
    .filters-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:12px; }
    .filters-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; align-items:end; }
    .filter-group { display:flex; flex-direction:column; gap:4px; }
    .filter-label { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
    .filter-select { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:7px 10px; font-size:12px; color:var(--text); font-family:inherit; cursor:pointer; width:100%; }
    .filter-select:focus { border-color:var(--accent); outline:none; }
    .filter-reset-wrap { display:flex; align-items:flex-end; }

    /* ── RÉSULTATS ── */
    .results-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .results-count { font-size:13px; color:var(--muted); }
    .results-count strong { color:var(--text); }

    /* ── LISTE ── */
    .ws-list { display:flex; flex-direction:column; gap:8px; }
    .ws-card { display:flex; align-items:center; gap:12px; padding:13px 16px; border:1px solid var(--border); border-radius:10px; background:var(--surface); cursor:pointer; transition:border-color .15s,background .15s; }
    .ws-card:hover { border-color:var(--accent); background:var(--fr-bg); }
    .dark .ws-card:hover { background:#0c2d48; }
    .ws-card-left { flex:1; min-width:0; }
    .ws-card-jour { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:1px; }
    .ws-card-name { font-size:14px; font-weight:700; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ws-card-meta { font-size:11px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .ws-card-right { flex-shrink:0; display:flex; align-items:center; gap:6px; }
    .tag { display:inline-block; border-radius:4px; padding:1px 6px; font-size:10px; font-weight:600; white-space:nowrap; }
    .tag-type { background:var(--tag-bg); color:var(--tag-text); }
    .pill { font-size:10px; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap; border:1px solid; }
    .pill-green  { background:var(--green-bg); color:var(--green); border-color:var(--green-border); }
    .pill-orange { background:var(--orange-bg); color:var(--orange); border-color:var(--orange-border); }
    .pill-grey   { background:var(--surface); color:var(--muted); border-color:var(--border); }
    .empty { text-align:center; padding:40px; color:var(--muted); font-style:italic; border:2px dashed var(--border); border-radius:10px; }

    /* ── MODALE DÉTAIL ── */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:9999; align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto; }
    .modal-overlay.open { display:flex; }
    .modal-box { background:var(--bg); border-radius:14px; max-width:680px; width:100%; border:1px solid var(--border); box-shadow:0 12px 40px rgba(0,0,0,.2); }
    .modal-top { display:flex; align-items:flex-start; justify-content:space-between; padding:18px 22px 14px; border-bottom:1px solid var(--border); gap:12px; }
    .modal-top-left { flex:1; min-width:0; }
    .modal-top-right { display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }
    .modal-atelier { font-size:18px; font-weight:800; line-height:1.3; }
    .modal-sub { font-size:12px; color:var(--muted); margin-top:3px; }
    .modal-close { cursor:pointer; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:15px; font-weight:700; font-family:inherit; color:var(--text); line-height:1; }
    .modal-close:hover { background:var(--border); }
    .modal-lang-toggle { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .modal-lang-btn { cursor:pointer; background:var(--surface); border:none; padding:5px 12px; font-size:12px; font-weight:700; font-family:inherit; color:var(--muted); }
    .modal-lang-btn:not(:last-child) { border-right:1px solid var(--border); }
    .modal-lang-btn.active { background:var(--accent); color:#fff; }
    .modal-body { padding:18px 22px 22px; display:flex; flex-direction:column; gap:20px; }
    .modal-grid { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; align-items:start; }
    .modal-lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); white-space:nowrap; padding-top:2px; }
    .modal-val { font-size:13px; }
    .modal-desc-box { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-size:13px; line-height:1.6; }
    .modal-desc-lbl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:6px; }
    .no-content { font-style:italic; color:var(--muted); font-size:12px; }
    .validated-badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; }
    .validated-yes { background:#dcfce7; color:#166534; }
    .validated-no  { background:#fee2e2; color:#dc2626; }
    .dark .validated-yes { background:#0a2e1a; color:#4ade80; }
    .dark .validated-no  { background:#2d0a0a; color:#f87171; }
    .badge { display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; white-space:nowrap; }
    .badge-lang { font-size:10px; font-weight:700; padding:1px 5px; border-radius:3px; }
    .badge-fr { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
    .badge-en { background:#f0fdf4; color:#166534; border:1px solid #86efac; }
    .piment { letter-spacing:-2px; font-size:13px; }

    @media(max-width:640px) {
      .modal-top { flex-direction:column; }
      .modal-top-right { flex-direction:row; align-items:center; }
    }

    /* ── TOAST ── */
    #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:#1f2328; color:#fff; border-radius:8px; padding:12px 22px; font-size:13px; font-weight:600; z-index:10000; transition:transform .3s,opacity .3s; opacity:0; white-space:nowrap; }
    #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

    footer { margin-top:48px; padding-top:14px; border-top:1px solid var(--border); text-align:center; font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">
      <h1>Tantramour 2026</h1>
      <p>ℹ️ <span data-i18n="ria_title">Informations Ateliers</span></p>
    </div>
    <div class="header-actions">
      <a class="btn" href="index.html" data-i18n="nav_accueil">🏠 Accueil</a>
      <a class="btn" href="index_bis.html" data-i18n="nav_dreamteam">🌀 DreamTeam</a>
      <button class="btn" onclick="hardReload()">🔄 <span data-i18n="nav_refresh">Refresh</span></button>
      <button class="btn" onclick="exportAteliersDetailsExcel()">📥 Export Excel</button>
      <button class="btn" id="modeBtn" onclick="toggleMode()">🌙 <span data-i18n="nav_mode_nuit">Mode Nuit</span></button>
      <button class="btn tm-lang-btn" onclick="I18n.setLang(I18n.getLang()==='fr'?'en':'fr')">🌐 EN</button>
    </div>
  </header>

  <!-- ══ ÉCRAN LISTE ══ -->
  <div id="screenList">

    <div class="filters-panel">
      <div class="filters-title">🔍 <span data-i18n="r_desc_filters_title">Filtres</span></div>
      <div class="filters-grid">
        <div class="filter-group">
          <div class="filter-label" data-i18n="r_desc_filter_jour">📅 Jour</div>
          <select class="filter-select" id="fJour" onchange="applyFilters()">
            <option value="" data-i18n="r_desc_all_days">Tous les jours</option>
          </select>
        </div>
        <div class="filter-group">
          <div class="filter-label" data-i18n="r_desc_filter_type">🏷 Type</div>
          <select class="filter-select" id="fType" onchange="applyFilters()">
            <option value="" data-i18n="r_desc_all_types">Tous les types</option>
          </select>
        </div>
        <div class="filter-group">
          <div class="filter-label" data-i18n="r_desc_filter_fac">🎓 Animateur</div>
          <select class="filter-select" id="fFac" onchange="applyFilters()">
            <option value="" data-i18n="r_desc_all_fac">Tous</option>
          </select>
        </div>
        <div class="filter-group">
          <div class="filter-label" data-i18n="ria_filter_helper">🤝 Helper</div>
          <select class="filter-select" id="fHelper" onchange="applyFilters()">
            <option value="" data-i18n="ria_filter_all_helpers">Tous</option>
          </select>
        </div>
        <div class="filter-group">
          <div class="filter-label" data-i18n="col_traducteur_long">🌐 Traducteur</div>
          <select class="filter-select" id="fTrad" onchange="applyFilters()">
            <option value="" data-i18n="ria_filter_all_trad">Tous</option>
          </select>
        </div>
        <div class="filter-group">
          <div class="filter-label" data-i18n="col_angel">👼 Angel</div>
          <select class="filter-select" id="fAngel" onchange="applyFilters()">
            <option value="" data-i18n="ria_filter_all_angels">Tous</option>
          </select>
        </div>
        <div class="filter-reset-wrap">
          <button class="btn btn-sm" onclick="resetFilters()" data-i18n="r_desc_filter_reset">✕ Réinitialiser</button>
        </div>
      </div>
    </div>

    <div class="results-bar">
      <div class="results-count" id="resultsCount"></div>
    </div>

    <div class="ws-list" id="wsList"></div>

  </div><!-- /screenList -->

  <div class="modal-overlay" id="detailModal" onclick="closeModalOnOverlay(event)">
    <div class="modal-box" id="detailBox">
      <div class="modal-top">
        <div class="modal-top-left">
          <div class="modal-atelier" id="mTitle">—</div>
          <div class="modal-sub" id="mSub"></div>
        </div>
        <div class="modal-top-right">
          <button class="modal-close" onclick="closeModal()" title="Fermer">✕</button>
          <div class="modal-lang-toggle">
            <button class="modal-lang-btn active" id="mlBtnFr" onclick="setModalLang('fr')">FR</button>
            <button class="modal-lang-btn" id="mlBtnEn" onclick="setModalLang('en')">ENG</button>
          </div>
        </div>
      </div>
      <div class="modal-body" id="mBody"></div>
    </div>
  </div>

  <footer data-i18n="ria_footer">Tantramour 2026 — Informations Ateliers</footer>
</div>

<div id="toast"></div>

<script src="github-api.js"></script>
<script src="loader.js"></script>
<script src="ref_piment.js"></script>
<script>
if (typeof LOGISTICS_HELPERS === 'undefined') window.LOGISTICS_HELPERS = {};
loadData(['data.js','ref_descriptions.js','logistics.js','logistics.special.js','logistics.helpers.js','ref_jours.js','ref_notes.js'], function() {

// ════════════════════════════════════════════
// CONSTANTES
// ════════════════════════════════════════════
var JOUR_ORDER = ['Jour 1','Jour 2','Jour 3','Jour 4','Jour 5','Jour 6','Jour 7'];
var JOUR_META  = {
  'Jour 1':{ labelEn:'Day 1', date:'Samedi 29 août',   dateEn:'Sat. Aug 29',  emoji:'🌅' },
  'Jour 2':{ labelEn:'Day 2', date:'Dimanche 30 août', dateEn:'Sun. Aug 30',  emoji:'☀️' },
  'Jour 3':{ labelEn:'Day 3', date:'Lundi 31 août',    dateEn:'Mon. Aug 31',  emoji:'🌿' },
  'Jour 4':{ labelEn:'Day 4', date:'Mardi 1 sept.',    dateEn:'Tue. Sep 1',   emoji:'🔥' },
  'Jour 5':{ labelEn:'Day 5', date:'Mercredi 2 sept.', dateEn:'Wed. Sep 2',   emoji:'💧' },
  'Jour 6':{ labelEn:'Day 6', date:'Jeudi 3 sept.',    dateEn:'Thu. Sep 3',   emoji:'🌙' },
  'Jour 7':{ labelEn:'Day 7', date:'Vendredi 4 sept.', dateEn:'Fri. Sep 4',   emoji:'✨' },
};

function jourLabel(jour) {
  var lang = (typeof I18n !== 'undefined') ? I18n.getLang() : 'fr';
  var meta = JOUR_META[jour] || {};
  return (lang === 'en' && meta.labelEn) ? meta.labelEn : (jour || '—');
}

// ════════════════════════════════════════════
// ÉTAT
// ════════════════════════════════════════════
var currentAgendaIdx = -1;
var _modalLang = 'fr';
var _modalEntry = null;

// ════════════════════════════════════════════
// INDEX DESCRIPTIONS
// ════════════════════════════════════════════
var DESCS_BY_NAME = {};
if (typeof REF_DESCRIPTIONS !== 'undefined') {
  REF_DESCRIPTIONS.forEach(function(d) {
    DESCS_BY_NAME[(d.atelier||'').trim().toLowerCase()] = d;
  });
}
function getDesc(atelier) {
  return DESCS_BY_NAME[(atelier||'').trim().toLowerCase()] || null;
}

// ════════════════════════════════════════════
// PEUPLEMENT DES FILTRES
// ════════════════════════════════════════════
function buildFilters() {
  var jours=new Set(), types=new Set(), facs=new Set(),
      helpers=new Set(), trads=new Set(), angels=new Set();

  AGENDA.forEach(function(e) {
    if (e.jour)       jours.add(e.jour);
    if (e.type)       types.add(e.type);
    if (e.fac1)       facs.add(e.fac1);
    if (e.fac2)       facs.add(e.fac2);
    if (e.helper1)    helpers.add(e.helper1);
    if (e.helper2)    helpers.add(e.helper2);
    if (e.helper3)    helpers.add(e.helper3);
    if (e.helper4)    helpers.add(e.helper4);
    if (e.traduction) trads.add(e.traduction);
    if (e.angel)      angels.add(e.angel);
  });

  function fill(selId, set, sorted) {
    var sel = document.getElementById(selId);
    (sorted ? Array.from(set).sort(function(a,b){return a.localeCompare(b,'fr');}) : JOUR_ORDER.filter(function(j){return set.has(j);}))
      .forEach(function(v) {
        var o = document.createElement('option');
        o.value = v; o.textContent = v;
        if (selId === 'fJour') {
          var meta = JOUR_META[v] || {};
          o.textContent = v + (meta.date ? ' — ' + meta.date : '');
        }
        sel.appendChild(o);
      });
  }

  fill('fJour',   jours,   false);
  fill('fType',   types,   true);
  fill('fFac',    facs,    true);
  fill('fHelper', helpers, true);
  fill('fTrad',   trads,   true);
  fill('fAngel',  angels,  true);
}

// ════════════════════════════════════════════
// FILTRAGE
// ════════════════════════════════════════════
function getFiltered() {
  var fJ = document.getElementById('fJour').value;
  var fT = document.getElementById('fType').value;
  var fF = document.getElementById('fFac').value;
  var fH = document.getElementById('fHelper').value;
  var fR = document.getElementById('fTrad').value;
  var fA = document.getElementById('fAngel').value;

  var result = [];
  AGENDA.forEach(function(e, idx) {
    if (fJ && e.jour !== fJ) return;
    if (fT && e.type !== fT) return;
    if (fF && e.fac1 !== fF && e.fac2 !== fF) return;
    if (fH && e.helper1 !== fH && e.helper2 !== fH && e.helper3 !== fH && e.helper4 !== fH) return;
    if (fR && e.traduction !== fR) return;
    if (fA && e.angel !== fA) return;
    result.push({ e:e, idx:idx });
  });

  result.sort(function(a,b) {
    var dj = JOUR_ORDER.indexOf(a.e.jour) - JOUR_ORDER.indexOf(b.e.jour);
    if (dj !== 0) return dj;
    return heureMin(a.e.heure) - heureMin(b.e.heure);
  });
  return result;
}

function applyFilters() { renderList(getFiltered()); }
window.applyFilters = applyFilters;

function resetFilters() {
  ['fJour','fType','fFac','fHelper','fTrad','fAngel'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  applyFilters();
}
window.resetFilters = resetFilters;

// ════════════════════════════════════════════
// RENDU LISTE
// ════════════════════════════════════════════
function renderList(items) {
  var list  = document.getElementById('wsList');
  var count = document.getElementById('resultsCount');
  count.innerHTML = I18n.t('r_desc_showing') + ' <strong>' + items.length + '</strong> ' +
    (items.length > 1 ? I18n.t('r_desc_workshops') : I18n.t('r_desc_workshop'));

  if (!items.length) {
    list.innerHTML = '<div class="empty">' + I18n.t('r_desc_no_result') + '</div>';
    return;
  }

  list.innerHTML = items.map(function(item) {
    var e   = item.e;
    var idx = item.idx;
    var meta = JOUR_META[e.jour] || {};
    var facs = [e.fac1,e.fac2].filter(Boolean).join(' & ');
    var pimentStr = e.piment > 0 ? ' ' + '🌶️'.repeat(e.piment) : '';
    var logEntry = e.logisticId && typeof LOGISTICS !== 'undefined' && LOGISTICS[e.logisticId];
    var hasLog = logEntry && (logEntry.text||'').trim();
    var isVal  = (getDesc(e.atelier) && getDesc(e.atelier).validatedByFac) ||
                 (logEntry && logEntry.validatedByFac);
    var pills = '';
    if (isVal)  pills += '<span class="pill pill-green">' + I18n.t('rsa_pill_validee') + '</span>';
    if (hasLog) pills += '<span class="pill pill-green">Log ✓</span>';
    else        pills += '<span class="pill pill-grey">Log —</span>';

    var langNow = I18n.getLang();
    var dateLabel = langNow === 'en' ? (meta.dateEn || meta.date) : meta.date;
    return '<div class="ws-card" onclick="selectAtelier(' + idx + ')">' +
      '<div class="ws-card-left">' +
        '<div class="ws-card-jour">' + esc(jourLabel(e.jour)) + (dateLabel ? ' — ' + dateLabel : '') +
          (e.heure ? ' · ' + esc(e.heure) : '') + '</div>' +
        '<div class="ws-card-name">' + esc(e.atelier||'—') + pimentStr + (e.id ? ' <span style="color:var(--muted);font-size:12px">(' + esc(e.id) + ')</span>' : '') + '</div>' +
        '<div class="ws-card-meta">' +
          '<span class="tag tag-type">' + esc(e.type||'') + '</span>' +
          (e.lieu ? '<span>📍 '+esc(e.lieu)+'</span>' : '') +
          (facs   ? '<span>🎓 '+esc(facs)+'</span>'   : '') +
        '</div>' +
      '</div>' +
      '<div class="ws-card-right">' + pills +
        '<span style="font-size:16px;color:var(--muted);margin-left:2px">›</span>' +
      '</div>' +
    '</div>';
  }).join('');

  window._currentItems = items;
}

// ════════════════════════════════════════════
// SÉLECTION → DÉTAIL
// ════════════════════════════════════════════
function selectAtelier(agendaIdx) {
  var e = AGENDA[agendaIdx];
  if (!e) return;
  currentAgendaIdx = agendaIdx;
  _modalEntry = e;
  _modalLang = (typeof I18n !== 'undefined') ? I18n.getLang() : 'fr';

// UTILITAIRES

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function htmlToText(html) {
  if (!html) return '';
  var div = document.createElement('div');
  div.innerHTML = html;
  return (div.textContent || div.innerText || '').replace(/\s+\n/g, '\n').trim();
}
function noteLabel(val, lang) {
  if (!val) return '';
  if (typeof REF_NOTES !== 'undefined') {
    var e = REF_NOTES.find(function(n){ return n.value===val; });
    if (e) return (lang==='en' && e.valueEn) ? e.valueEn : e.value;
  }
  return val;
}
function pimentHtml(n) {
  return n > 0 ? '<span class="piment">'+'🌶️'.repeat(n)+'</span>' : '';
}
function isBilingue(nom) {
  if (!nom || typeof REF_RESSOURCES==='undefined') return false;
  var r = REF_RESSOURCES.find(function(x){ return x.value===nom; });
  return r && r.langues && r.langues.indexOf('FR')!==-1 && r.langues.indexOf('EN')!==-1;
}
function angelWithPhone(nom) {
  if (!nom) return '—';
  if (typeof REF_RESSOURCES === 'undefined') return esc(nom);
  var r = REF_RESSOURCES.find(function(x){ return x.value===nom; });
  if (!r || !r.tel) return esc(nom);
  return esc(nom) + ' <span style="color:var(--muted)">(' + esc(r.tel) + ')</span>';
}
function heureMin(h) {
  if (!h) return null;
  var m = String(h).replace(/\./g,':').match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1])*60+parseInt(m[2]) : null;
}
function calcDuree(h) {
  if (!h) return null;
  var m = String(h).replace(/\./g,':').replace(/[–—]/g,'-').match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
  if (!m) return null;
  var d = (parseInt(m[3])*60+parseInt(m[4])) - (parseInt(m[1])*60+parseInt(m[2]));
  if (d < 0) d += 1440;
  return d;
}
function fmtDuree(mins) {
  if (!mins) return '';
  var h = Math.floor(mins/60), mn = mins%60;
  return h > 0 ? (mn > 0 ? h+'h'+(mn<10?'0':'')+mn : h+'h') : mn+'min';
}
function fmtHeure(mins) {
  if (mins == null) return '';
  var h = Math.floor(mins/60)%24, m = mins%60;
  return h+':'+(m<10?'0':'')+m;
}
function jourSubtitle(jour, lang) {
  var m = JOUR_META[jour];
  if (!m) return jour;
  var j = (lang === 'en' && m.labelEn) ? m.labelEn : jour;
  var d = (lang === 'en' && m.dateEn) ? m.dateEn : m.date;
  return j + (d ? ' — ' + d : '');
}
function parseHeureDebut(heure) {
  if (!heure) return '';
  var match = String(heure).replace(/\./g, ':').match(/(\d{1,2}:\d{2})/);
  if (!match) return '';
  var parts = match[1].split(':');
  return parts[0].padStart(2, '0') + ':' + parts[1].padStart(2, '0');
}
function parseHeureFin(heure) {
  if (!heure) return '';
  var all = String(heure).replace(/\./g, ':').match(/(\d{1,2}:\d{2})/g);
  if (!all || all.length < 2) return '';
  var parts = all[1].split(':');
  return parts[0].padStart(2, '0') + ':' + parts[1].padStart(2, '0');
}
function buildAteliersExportRows() {
  return AGENDA.map(function(e) {
    var desc = getDesc(e.atelier) || {};
    var logId = e.logisticId || '';
    var logEntry = logId && typeof LOGISTICS !== 'undefined' ? LOGISTICS[logId] : null;
    var specEntry = logId && typeof LOGISTICS_SPECIAL !== 'undefined' ? LOGISTICS_SPECIAL[logId] : null;
    var helpEntry = logId && typeof LOGISTICS_HELPERS !== 'undefined' ? LOGISTICS_HELPERS[logId] : null;
    return {
      id: e.id || '',
      atelier: e.atelier || '',
      fac1: e.fac1 || '',
      fac2: e.fac2 || '',
      date: getExportDateValue(e),
      jour: e.jour || '',
      type: e.type || '',
      heureDebut: parseHeureDebut(e.heure || ''),
      heureFin: parseHeureFin(e.heure || ''),
      lieu: e.lieu || '',
      piment: e.piment || 0,
      note: e.note || '',
      nomEn: desc.nomEn || '',
      descFr: desc.descFr || '',
      descEn: desc.descEn || '',
      consigneFr: desc.consigne || '',

      prepDuration: logEntry && logEntry.prepDuration !== undefined ? logEntry.prepDuration : '',
      logInfo: logEntry ? htmlToText(logEntry.html || logEntry.text || '') : '',

      helperAvant: helpEntry ? htmlToText(helpEntry.avant || '') : '',
      helperPendant: helpEntry ? htmlToText(helpEntry.pendant || '') : '',
      helperApres: helpEntry ? htmlToText(helpEntry.apres || '') : ''
    };
  });
}
function escapeXml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function formatExportDate(dateStr) {
  if (!dateStr) return '';
  var match = String(dateStr).match(/(\d{1,2})\s+[A-Za-zéû\.]+\s+(\d{4})/);
  if (!match) return dateStr;
  var day = String(parseInt(match[1], 10)).padStart(2, '0');
  var year = match[2];
  var monthMap = {
    janvier:'01', fevrier:'02', février:'02', mars:'03', avril:'04', mai:'05', juin:'06', juillet:'07',
    aout:'08', août:'08', septembre:'09', octobre:'10', novembre:'11', decembre:'12', décembre:'12'
  };
  var monthKey = String(dateStr).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').match(/\d{1,2}\s+([a-z]+)\s+\d{4}/);
  var month = monthKey && monthMap[monthKey[1]] ? monthMap[monthKey[1]] : '';
  return month ? (day + '/' + month + '/' + year) : dateStr;
}
function getExportDateValue(entry) {
  var refJour = typeof REF_JOURS !== 'undefined'
    ? REF_JOURS.find(function(j) { return j.value === entry.jour; })
    : null;
  if (refJour && refJour.dateDdMmYyyy) return refJour.dateDdMmYyyy;
  return formatExportDate(entry.date || '');
}

function buildExcelRows(rows) {
  return rows.map(function(row) {
    return [
      row.id,row.atelier,row.fac1,row.fac2,row.type,row.date,row.jour,row.heureDebut,row.heureFin,row.lieu,row.piment,row.note,
      row.nomEn,row.descFr,row.descEn,row.consigneFr,row.consigneEn,row.prepDuration,row.logInfo,row.logSpecial,row.helperAvant,row.helperPendant,row.helperApres
    ];
  });
}
function downloadExcelFile(rows, filename) {
  var workbook = new ExcelJS.Workbook();
  var sheet = workbook.addWorksheet('Ateliers');
  var headers = [
    'ID','Atelier (FR)','Animateur 1','Animateur 2','Type','Date (DD/MM/YYYY)','Jour','Heure de début','Heure de fin','Lieu','Piment','Note',
    'Workshop name (ENG)','Description (FR)','Description (ENG)','Instructions participants (FR)','Participant instructions (ENG)',
    'Estimation préparation','Informations logistiques','Besoins logistiques spécifiques','Consignes HELPER – AVANT','Consignes HELPER – PENDANT','Consignes HELPER – APRES'
  ];
  var grayColumns = { 11:true, 13:true, 14:true, 15:true, 16:true, 17:true, 18:true, 19:true, 20:true, 21:true, 22:true, 23:true };
  var columnWidths = [12, 30, 24, 24, 18, 14, 12, 14, 14, 16, 10, 18, 28, 36, 36, 36, 36, 20, 40, 40, 30, 30, 30];

  sheet.addRow(headers);
  buildExcelRows(rows).forEach(function(values) {
    sheet.addRow(values);
  });

  sheet.columns.forEach(function(column, index) {
    column.width = columnWidths[index] || 18;
  });
 
  sheet.autoFilter = {
    from: { row: 1, column: 1 },
    to: { row: 1, column: headers.length }
  };
  sheet.views = [{ state: 'frozen', xSplit: 2, ySplit: 1 }];

  sheet.getRow(1).eachCell(function(cell) {
    cell.font = { bold: true };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9EAF7' } };
    cell.border = {
      right: { style: 'dotted', color: { argb: 'FF9CA3AF' } },
      bottom: { style: 'thin', color: { argb: 'FFD1D5DB' } }
    };
  });

  sheet.eachRow(function(row, rowNumber) {
    if (rowNumber === 1) return;
    var baseColor = rowNumber % 2 === 0 ? 'FFFFFFFF' : 'FFF3F4F6';
    row.eachCell(function(cell, colNumber) {
      var fillColor = grayColumns[colNumber] ? 'FFE5E7EB' : baseColor;
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: fillColor } };
      cell.border = {
        right: { style: 'dotted', color: { argb: 'FF9CA3AF' } },
        bottom: { style: 'thin', color: { argb: 'FFE5E7EB' } }
      };
      cell.alignment = {
        vertical: 'top',
        wrapText: colNumber >= 13
      };
      if (colNumber === 6 && cell.value) {
        cell.numFmt = 'dd/mm/yyyy';
      }
    });
  });

  sheet.getColumn(6).eachCell(function(cell, rowNumber) {
    if (rowNumber === 1 || !cell.value) return;
    var parts = String(cell.value).split('/');
    if (parts.length === 3) {
      cell.value = new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
      cell.numFmt = 'dd/mm/yyyy';
    }
  });

  return workbook.xlsx.writeBuffer().then(function(buffer) {
    var blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
}

  if (!h) return 9999;
  var m = String(h).replace(/\./g,':').match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1])*60+parseInt(m[2]) : 9999;
}
function getDureeAtelier(heure) {
  if (!heure) return '';
  var m = String(heure).replace(/\./g,':').match(/(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})/);
  if (!m) return '';
  var debut = parseInt(m[1])*60+parseInt(m[2]);
  var fin   = parseInt(m[3])*60+parseInt(m[4]);
  var dur   = fin - debut;
  if (dur <= 0) return '';
  var h  = Math.floor(dur/60);
  var mn = dur % 60;
  return h > 0 ? h + 'h' + (mn > 0 ? (mn < 10 ? '0' : '') + mn : '') : mn + ' min';
}

function hardReload() {
  if ('caches' in window) {
    caches.keys().then(function(keys) {
      return Promise.all(keys.map(function(k){ return caches.delete(k); }));
    }).finally(function() { location.reload(true); });
  } else { location.reload(true); }
}
window.hardReload = hardReload;

function toggleMode() {
  var isDark = document.body.classList.toggle('dark');
  var modeBtn = document.getElementById('modeBtn');
  if (isDark) {
    modeBtn.innerHTML = '☀️ <span data-i18n="nav_mode_jour">' + I18n.t('nav_mode_jour') + '</span>';
  } else {
    modeBtn.innerHTML = '🌙 <span data-i18n="nav_mode_nuit">' + I18n.t('nav_mode_nuit') + '</span>';
  }
}
window.toggleMode = toggleMode;

if (location.search.includes('v=') && !sessionStorage.getItem('_refreshed_'+location.pathname)) {
  sessionStorage.setItem('_refreshed_'+location.pathname,'1');
  hardReload();
}

// ── Re-render on language change
document.addEventListener('tm_lang_changed', function() {
  // Re-render list so dates and pills reflect the new language
  applyFilters();
  // If detail screen is open, re-render it
  if (document.getElementById('screenDetail').style.display !== 'none' && currentAgendaIdx >= 0) {
    selectAtelier(currentAgendaIdx);
  }
});

// ── Init
buildFilters();
applyFilters();
showScreen('list');

}); // fin loadData
</script>
