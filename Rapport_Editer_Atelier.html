<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tantramour 2026 — Éditer un atelier</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root {
    --bg:#ffffff; --surface:#f7f8fa; --border:#e5e7eb;
    --text:#1f2328; --muted:#57606a; --accent:#3b82d4;
    --header-bg:#f0f4fb; --row-alt:#f7f8fa;
    --tag-bg:#eef2ff; --tag-text:#3b5bdb;
    --green:#16a34a; --green-bg:#dcfce7; --green-border:#86efac;
    --badge-h:#e0f2fe; --badge-ht:#0369a1;
    --badge-a:#fce7f3; --badge-at:#9d174d;
    --badge-f:#dcfce7; --badge-ft:#166534;
  }
  .dark {
    --bg:#0d1117; --surface:#161b22; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
    --header-bg:#1c2333; --row-alt:#161b22; --tag-bg:#1c2a4a; --tag-text:#79a8ff;
    --green-bg:#052e16; --green-border:#166534;
    --badge-h:#0c2d48; --badge-ht:#58a6ff;
    --badge-a:#3b1030; --badge-at:#f0abca;
    --badge-f:#0a2e1a; --badge-ft:#4ade80;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Segoe UI",system-ui,sans-serif; font-size:14px; line-height:1.6; background:var(--bg); color:var(--text); transition:background .2s,color .2s; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 20px 60px; }

  /* ── HEADER ── */
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .logo h1 { font-size:20px; font-weight:700; }
  .logo p  { font-size:26px; font-weight:800; color:var(--accent); line-height:1.2; margin-top:2px; }
  .header-actions { display:flex; gap:8px; align-items:center; }
  .btn { cursor:pointer; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 14px; font-size:13px; color:var(--text); font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { background:var(--border); }

  /* ── FILTERS ── */
  .filters { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; align-items:flex-end; }
  .filter-group { display:flex; flex-direction:column; gap:4px; }
  .filter-group label { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:600; }
  select, input[type="text"] { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:7px 10px; font-size:13px; color:var(--text); font-family:inherit; cursor:pointer; }
  select { min-width:160px; }
  input[type="text"] { min-width:200px; }
  .stats { font-size:12px; color:var(--muted); margin-bottom:14px; }
  .stats span { color:var(--accent); font-weight:600; }

  /* ── LISTE ATELIERS ── */
  .list-wrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:28px; }
  .list-item { display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .1s; }
  .list-item:last-child { border-bottom:none; }
  .list-item:hover { background:var(--row-alt); }
  .list-item.selected { background:#eff6ff; border-left:3px solid var(--accent); }
  .dark .list-item.selected { background:#0c2d48; }
  .li-jour { font-size:11px; font-weight:700; color:var(--accent); min-width:52px; white-space:nowrap; }
  .li-heure { font-size:11px; color:var(--muted); min-width:108px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .li-atelier { font-size:13px; font-weight:600; flex:1; }
  .li-fac { font-size:11px; color:var(--muted); min-width:140px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .li-piment { font-size:12px; letter-spacing:-1px; min-width:52px; text-align:center; }
  .li-type { font-size:10px; font-weight:600; padding:1px 7px; border-radius:4px; background:var(--tag-bg); color:var(--tag-text); white-space:nowrap; max-width:160px; overflow:hidden; text-overflow:ellipsis; }
  .li-lieu { font-size:11px; color:var(--muted); min-width:70px; }
  .li-arrow { font-size:14px; color:var(--muted); }
  .empty { padding:40px; text-align:center; color:var(--muted); }

  /* ── FORMULAIRE D'ÉDITION ── */
  .editor-panel { background:var(--surface); border:2px solid var(--accent); border-radius:10px; padding:24px 28px; }
  .editor-title { font-size:16px; font-weight:700; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
  .editor-title .badge-idx { font-size:11px; font-weight:600; padding:2px 8px; border-radius:4px; background:var(--accent); color:#fff; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px 24px; }
  @media(max-width:640px) { .form-grid { grid-template-columns:1fr; } }
  .form-group { display:flex; flex-direction:column; gap:5px; }
  .form-group.full { grid-column:1/-1; }
  .form-group label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
  .form-group input, .form-group select, .form-group textarea {
    background:var(--bg); border:1px solid var(--border); border-radius:6px;
    padding:8px 10px; font-size:13px; color:var(--text); font-family:inherit; width:100%;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,212,.12);
  }
  .form-group textarea { resize:vertical; min-height:60px; }
  .checkbox-row { display:flex; align-items:center; gap:10px; padding:8px 0; }
  .checkbox-row input[type="checkbox"] { width:17px; height:17px; cursor:pointer; accent-color:var(--accent); flex-shrink:0; }
  .checkbox-row .cb-label { font-size:13px; font-weight:600; cursor:pointer; user-select:none; }
  .checkbox-row .cb-hint { font-size:11px; color:var(--muted); }
  .piment-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .piment-btn { cursor:pointer; padding:6px 14px; border-radius:6px; border:2px solid var(--border); background:var(--bg); font-size:13px; font-family:inherit; color:var(--text); transition:all .15s; }
  .piment-btn.active { border-color:var(--accent); background:#eff6ff; font-weight:700; }
  .dark .piment-btn.active { background:#0c2d48; }

  /* ── WIDGET HEURE ── */
  .heure-widget { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .heure-widget select { min-width:0; width:100px; flex-shrink:0; }
  .heure-sep { font-size:15px; font-weight:700; color:var(--muted); user-select:none; }
  .heure-preview { font-size:13px; font-weight:700; color:var(--accent); background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:7px 12px; white-space:nowrap; min-width:140px; text-align:center; font-variant-numeric:tabular-nums; }
  .heure-preview.empty { color:var(--muted); font-weight:400; font-style:italic; }

  /* ── ACTIONS ── */
  .editor-actions { display:flex; gap:10px; margin-top:24px; flex-wrap:wrap; align-items:center; }
  .btn-primary { cursor:pointer; background:var(--accent); color:#fff; border:none; border-radius:6px; padding:9px 22px; font-size:15px; font-weight:700; font-family:inherit; display:inline-flex; align-items:center; gap:7px; }
  .btn-primary:hover { filter:brightness(1.1); }
  .btn-primary:disabled { opacity:.55; cursor:not-allowed; filter:none; }
  .btn-secondary { cursor:pointer; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:9px 20px; font-size:14px; color:var(--text); font-family:inherit; }
  .btn-secondary:hover { background:var(--border); }
  .btn-danger { cursor:pointer; background:#fef2f2; color:#dc2626; border:1px solid #fca5a5; border-radius:6px; padding:9px 20px; font-size:14px; font-family:inherit; font-weight:600; margin-left:auto; }
  .btn-danger:hover { background:#fca5a5; }
  .btn-new { cursor:pointer; background:#f0fdf4; color:#16a34a; border:1px solid #86efac; border-radius:6px; padding:6px 14px; font-size:13px; font-family:inherit; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .btn-new:hover { background:#dcfce7; }
  .editor-panel.is-new { border-color:#16a34a; }
  .badge-new { background:#16a34a !important; }
  .saving-indicator { font-size:13px; color:var(--muted); display:none; align-items:center; gap:6px; }
  .saving-indicator.show { display:flex; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .spinner { width:15px; height:15px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }

  /* ── PANNEAU LOGISTIQUE ── */
  /* ── Blocs section dans l'éditeur ── */
  .section-block { margin-top:28px; padding-top:22px; border-top:2px solid var(--border); }
  .section-block-title { font-size:15px; font-weight:700; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .section-block-sub { font-size:12px; color:var(--muted); margin-bottom:16px; }
  .form-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px 24px; }
  @media(max-width:640px) { .form-grid-2 { grid-template-columns:1fr; } }
  .desc-area { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:13px; color:var(--text); font-family:inherit; width:100%; resize:vertical; min-height:80px; outline:none; line-height:1.6; }
  .desc-area:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,212,.12); }
  .res-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:10px 14px; background:var(--surface); border:1px solid var(--border); border-radius:6px; margin-bottom:8px; }
  .res-row label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); white-space:nowrap; min-width:110px; }
  .res-row input[type="number"] { width:64px; padding:5px 8px; border:1px solid var(--border); border-radius:5px; font-size:13px; background:var(--bg); color:var(--text); font-family:inherit; }
  .res-row .res-hint { font-size:11px; color:var(--muted); flex:1; }
  .validated-badge { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:6px; }
  .validated-badge.yes { background:#dcfce7; color:#16a34a; border:1px solid #86efac; }
  .validated-badge.no  { background:#fef3c7; color:#92400e; border:1px solid #fcd34d; }
  .helper-sub-lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); padding:8px 0 4px; }
  .updated-stamp { font-size:11px; color:var(--muted); font-style:italic; padding-top:6px; }

  .logistics-panel { margin-top:40px; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .logistics-header { background:var(--header-bg); padding:16px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; border-bottom:1px solid var(--border); }
  .logistics-header-title { font-size:15px; font-weight:700; }
  .logistics-header-meta { font-size:12px; color:var(--muted); }
  .logistics-body { padding:20px 22px; }
  .logistics-list { display:flex; flex-direction:column; gap:12px; }
  .logistics-item { border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .logistics-item-header { background:var(--surface); padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .logistics-item-ateliers { font-size:13px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .logistics-item-actions { display:flex; gap:6px; flex-shrink:0; }
  .logistics-item-body { padding:14px 16px; border-top:1px solid var(--border); background:var(--bg); }
  .logistics-item-body.collapsed { display:none; }
  /* Prévisualisation HTML */
  .logistics-html-preview { font-size:13px; line-height:1.7; color:var(--text); }
  .logistics-html-preview p  { margin-bottom:6px; }
  .logistics-html-preview ul { padding-left:20px; }
  .logistics-html-preview ol { padding-left:20px; }
  .logistics-html-preview li { margin-bottom:2px; }
  /* Zone d'édition */
  .logistics-edit-zone { display:none; }
  .logistics-edit-zone.active { display:block; }
  /* Barre de formatage */
  .rte-toolbar { display:flex; gap:4px; flex-wrap:wrap; padding:6px 8px; background:var(--surface); border:1px solid var(--border); border-bottom:none; border-radius:6px 6px 0 0; }
  .rte-btn { cursor:pointer; background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:4px 9px; font-size:13px; font-family:inherit; color:var(--text); line-height:1.4; transition:background .1s; }
  .rte-btn:hover { background:var(--border); }
  .rte-btn b { font-weight:900; }
  .rte-sep { width:1px; background:var(--border); margin:2px 4px; align-self:stretch; }
  /* Zone éditable contenteditable */
  .rte-editor {
    min-height:120px; padding:10px 12px;
    border:1px solid var(--border); border-radius:0 0 6px 6px;
    background:var(--bg); color:var(--text);
    font-size:13px; line-height:1.7; font-family:inherit;
    outline:none; overflow-y:auto;
  }
  .rte-editor:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,212,.12); }
  .rte-editor ul { padding-left:20px; }
  .rte-editor ol { padding-left:20px; }
  .rte-editor li { margin-bottom:2px; }
  .rte-editor p  { margin-bottom:4px; }
  .logistics-edit-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center; }
  .btn-danger { cursor:pointer; background:#fef2f2; color:#dc2626; border:1px solid #fca5a5; border-radius:6px; padding:8px 16px; font-size:13px; font-family:inherit; font-weight:600; }
  .btn-danger:hover { background:#fca5a5; }
  .btn-success { cursor:pointer; background:var(--green-bg); color:var(--green); border:1px solid var(--green-border); border-radius:6px; padding:8px 18px; font-size:13px; font-family:inherit; font-weight:700; }
  .btn-success:hover { filter:brightness(.95); }
  .logistics-empty { padding:32px; text-align:center; color:var(--muted); font-style:italic; }
  .logistics-saving { font-size:12px; color:var(--muted); display:none; align-items:center; gap:5px; }
  .logistics-saving.show { display:flex; }

  /* ── SUCCESS TOAST ── */
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1f2328; color:#fff; border-radius:8px; padding:12px 20px; font-size:13px; font-weight:600; z-index:999; display:none; align-items:center; gap:8px; box-shadow:0 4px 16px rgba(0,0,0,.25); }
  .toast.show { display:flex; animation:fadeInUp .25s ease; }
  @keyframes fadeInUp { from{opacity:0;transform:translateX(-50%) translateY(8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

  footer { margin-top:48px; padding-top:14px; border-top:1px solid var(--border); text-align:center; font-size:12px; color:var(--muted); }
</style>

<script>
// Initialisation par défaut — écrasée si logistics.helpers.js se charge correctement
if (typeof LOGISTICS_HELPERS === 'undefined') window.LOGISTICS_HELPERS = {};
loadData(['data.js', 'ref_descriptions.js', 'logistics.js', 'logistics.special.js', 'logistics.helpers.js'], function() {

// ══════════════════════════════════════════════
// ÉTAT
// ══════════════════════════════════════════════
let selectedIdx = null;   // index dans AGENDA
let editedData  = null;   // copie de travail de l'entrée en cours

// ══════════════════════════════════════════════
// INIT FILTRE TYPE
// ══════════════════════════════════════════════
const selType = document.getElementById('filterType');
REF_TYPES.forEach(t => {
  const o = document.createElement('option');
  o.value = t.value; o.text = t.label;
  selType.appendChild(o);
});

// Peupler le filtre animateur (liste triée des fac1/fac2 présents dans AGENDA)
const selFac = document.getElementById('filterFac');
const facsUniq = [...new Set(
  AGENDA.flatMap(e => [e.fac1, e.fac2].filter(Boolean))
)].sort((a, b) => a.localeCompare(b, 'fr'));
facsUniq.forEach(f => {
  const o = document.createElement('option');
  o.value = f; o.text = f;
  selFac.appendChild(o);
});

// ══════════════════════════════════════════════
// FILTRE + TRI
// ══════════════════════════════════════════════
const JOUR_ORDER = ['Jour 1','Jour 2','Jour 3','Jour 4','Jour 5','Jour 6','Jour 7'];

function getFiltered() {
  const j = document.getElementById('filterJour').value;
  const t = document.getElementById('filterType').value;
  const f = document.getElementById('filterFac').value;
  const s = document.getElementById('filterSearch').value.trim().toLowerCase();
  return AGENDA
    .map((e, i) => ({ e, i }))
    .filter(({e}) =>
      (!j || e.jour === j) &&
      (!t || e.type === t) &&
      (!f || e.fac1 === f || e.fac2 === f) &&
      (!s || e.atelier.toLowerCase().includes(s) || (e.fac1||'').toLowerCase().includes(s) || (e.fac2||'').toLowerCase().includes(s))
    )
    .sort((a, b) => {
      const dj = JOUR_ORDER.indexOf(a.e.jour) - JOUR_ORDER.indexOf(b.e.jour);
      if (dj !== 0) return dj;
      return heureMin(a.e.heure) - heureMin(b.e.heure);
    });
}

function heureMin(h) {
  if (!h) return 9999;
  const m = h.replace(/\./g,':').match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1])*60+parseInt(m[2]) : 9999;
}

// ════════════════════════════════════════════════
// LOGIQUE ANGEL — résolution dynamique
// ════════════════════════════════════════════════
function _parseHM(s) {
  if (!s) return null;
  const norm = String(s).replace(/\./g, ':').trim();
  const m = norm.match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : null;
}

function resolveAngelEdit(jour, heure) {
  if (!jour || !heure) return '';
  const norm = String(heure).replace(/\./g, ':').replace(/[–\u2013\u2014]/g, '-');
  const parts = norm.split(/\s*-+\s*/);
  const debut = _parseHM(parts[0]);
  let fin = parts[1] ? _parseHM(parts[1]) : null;
  if (debut === null) return '';
  if (fin !== null && fin <= debut) fin += 24 * 60;
  const milieu = fin !== null ? (debut + fin) / 2 : debut + 1;
  const shifts = AGENDA.filter(s => s.type === 'SHIFT ANGEL' && s.jour === jour && s.angel);
  for (const s of shifts) {
    const sn = String(s.heure).replace(/\./g, ':').replace(/[–\u2013\u2014]/g, '-');
    const sp = sn.split(/\s*-+\s*/);
    const sd = _parseHM(sp[0]);
    let sf = sp[1] ? _parseHM(sp[1]) : null;
    if (sd === null) continue;
    if (sf !== null && sf <= sd) sf += 24 * 60;
    if (sf === null) sf = sd + 180;
    if (milieu >= sd && milieu <= sf) return s.angel;
  }
  return '';
}

  document.getElementById('stats').innerHTML = `<span>${items.length}</span> atelier(s) — cliquez sur une ligne pour l'éditer`;

  const wrap = document.getElementById('listWrap');
  if (!items.length) {

  }

  wrap.innerHTML = items.map(({e, i}) => {
    const pimentStr = e.piment > 0 ? '🌶️'.repeat(e.piment) : '<span style="color:var(--muted);font-size:11px">—</span>';
    const sel = selectedIdx === i ? ' selected' : '';

    const atelierLabel = e.id ? `${e.atelier||'—'} <span style="color:var(--muted);font-size:11px">(${e.id})</span>` : (e.atelier||'—');
    return `<div class="list-item${sel}" onclick="selectAtelier(${i})" id="li-${i}">

}

function selectAtelier(idx) {
  selectedIdx = idx;
  editedData  = Object.assign({}, AGENDA[idx]); // copie superficielle

  // Mettre à jour la classe selected dans la liste
  document.querySelectorAll('.list-item').forEach(el => el.classList.remove('selected'));

  panel.style.display = '';

}

// ── Widget heure : parse ────────────────────────────────────────────────────
// Extrait HH:MM depuis une chaîne "HH:MM - HH:MM" (tolère . et espaces)
function parseHeureDebut(h) {
  if (!h) return '';
  const m = String(h).replace(/\./g, ':').match(/(\d{1,2}:\d{2})/);
  if (!m) return '';
  const [hh, mm] = m[1].split(':');
  return hh.padStart(2,'0') + ':' + mm.padStart(2,'0');
}
function parseHeureFin(h) {
  if (!h) return '';
  const norm = String(h).replace(/\./g, ':');
  const all = norm.match(/(\d{1,2}:\d{2})/g);
  if (!all || all.length < 2) return '';
  const [hh, mm] = all[1].split(':');
  return hh.padStart(2,'0') + ':' + mm.padStart(2,'0');
}

// Construit un <select> depuis REF_HEURES avec valeur pré-sélectionnée
function buildHeureSelect(id, val) {
  const opts = `<option value="">—</option>` +
    REF_HEURES.map(h =>
      `<option value="${h.value}"${h.value === val ? ' selected' : ''}>${h.value}</option>`
    ).join('');
  return `<select id="${id}" onchange="onHeureChange()">${opts}</select>`;
}

// Appelé quand l'un des deux selects heure change
function onHeureChange() {
  const debut = document.getElementById('f-heure-debut').value;
  const fin   = document.getElementById('f-heure-fin').value;
  const prev  = document.getElementById('heure-preview');

  if (debut && fin) {
    const valeur = debut + ' - ' + fin;
    editedData.heure = valeur;
    prev.textContent = valeur;
    prev.classList.remove('empty');
  } else if (debut) {
    editedData.heure = debut;
    prev.textContent = debut + ' - ?';
    prev.classList.add('empty');
  } else {
    editedData.heure = '';
    prev.textContent = 'Choisir début et fin';
    prev.classList.add('empty');
  }
}
window.onHeureChange = onHeureChange;

function buildSelect(id, refArr, val, allowEmpty) {
  const opts = (allowEmpty ? `<option value="">— aucun —</option>` : '') +
    refArr.map(r => `<option value="${esc(r.value)}"${r.value==val?' selected':''}>${esc(r.label||r.value)}</option>`).join('');
  return `<select id="${id}" onchange="fieldChange('${id}')">${opts}</select>`;
}

function buildPersonSelect(id, refArr, val) {
  const opts = `<option value="">— aucun —</option>` +
    refArr.map(r => `<option value="${esc(r.value)}"${r.value===val?' selected':''}>${esc(r.value)}</option>`).join('');
  return `<select id="${id}" onchange="fieldChange('${id}')">${opts}</select>`;
}

function findDesc(atelierName) {
  if (typeof REF_DESCRIPTIONS === 'undefined') return null;
  return REF_DESCRIPTIONS.find(d => (d.atelier||'').trim() === (atelierName||'').trim()) || null;

function fieldChange(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const field = id.replace('f-', '');
  const val = el.value;
  // Mapping id → clé AGENDA (champs standard)
  const map = {
    'jour':'jour','atelier':'atelier','type':'type','lieu':'lieu',
    'fac1':'fac1','fac2':'fac2','traduction':'traduction',
    'helper1':'helper1','helper2':'helper2','helper3':'helper3','helper4':'helper4',
    'angel':'angel','note':'note'
  };
  const key = map[field];
  if (key) editedData[key] = val;

  // Champs personnalisés (stockés sur editedData avec préfixe _)
  if (field === 'minRes')      { editedData._minRes      = parseInt(val,10)||0; }
  if (field === 'minHelpers')  { editedData._minHelpers  = parseInt(val,10)||0; }
  if (field === 'minTrad')     { editedData._minTrad     = parseInt(val,10)||0; }
  if (field === 'tradCounts')  { editedData._tradCounts  = parseInt(val,10)||0; }
  // Champs description (stockés temporairement sur editedData)
  if (field === 'atelierEn')   { editedData._nomEn       = val; }
  if (field === 'consigneFr')  { editedData._consigneFr  = val; }
  if (field === 'consigneEn')  { editedData._consigneEn  = val; }

  // Synchroniser la date si le jour change
  if (field === 'jour') {
    const ref = REF_JOURS.find(j => j.value === val);
    if (ref) editedData.date = ref.date;
  }
}

// SAUVEGARDE DIRECTE → data.js
// Stratégie : localhost → serveur Python (/save)
//             ailleurs  → GitHub API
// ══════════════════════════════════════════════
async function sauvegarder(content) {
  // Ouvert en file:// → ni serveur local ni GitHub accessible
  if (location.protocol === 'file:') {
    throw new Error('Ouvrez le rapport via http://localhost:3000 (lancez start.bat) pour pouvoir sauvegarder.');
  }
  const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (isLocal) {
    const res = await fetch('http://localhost:3000/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: 'data.js', content })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `Serveur local : erreur ${res.status}`);
    }
    return;
  }
  // GitHub Pages ou autre hébergement distant
  await githubSaveFile('data.js', content);
}

// Fonction générique de sauvegarde d'un fichier quelconque
async function saveFile(filename, content) {
  if (location.protocol === 'file:') throw new Error('Ouvrez via http://localhost:3000 (start.bat) pour sauvegarder.');
  const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (isLocal) {
    const res = await fetch('http://localhost:3000/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename, content })
    });
    if (!res.ok) { const e = await res.json().catch(()=>{}); throw new Error(e && e.error ? e.error : 'Erreur ' + res.status); }
    return;
  }
  await githubSaveFile(filename, content);
}

async function saveLogistique() {
  if (selectedIdx === null || selectedIdx === -1) return;
  const a = AGENDA[selectedIdx];
  const ind = document.getElementById('logSaving');
  if (ind) ind.classList.add('show');

  const today = new Date().toISOString().slice(0,10) + ' ' + new Date().toTimeString().slice(0,5);

  // Générer logisticId si nécessaire
  let logId = editedData.logisticId || a.logisticId;
  if (!logId) {
    const safeName = (a.atelier||'NEW').replace(/[^a-zA-Z0-9]/g,'_').slice(0,30).toUpperCase();
    const jourKey  = (a.jour||'').replace(/\s+/g,'').toUpperCase();
    logId = jourKey + '_' + safeName;
    editedData.logisticId = logId;
    a.logisticId = logId;
  }

  // Lire les RTEs
  const logRte     = document.getElementById('log-rte');
  const logSpecRte = document.getElementById('log-special-rte');
  const avantRte   = document.getElementById('log-helpers-avant');
  const pendantRte = document.getElementById('log-helpers-pendant');
  const apresRte   = document.getElementById('log-helpers-apres');
  const prepEl     = document.getElementById('f-prepDuration');

  const logHtml  = logRte     ? logRte.innerHTML.trim()     : '';
  const specHtml = logSpecRte ? logSpecRte.innerHTML.trim() : '';
  const prepDur  = prepEl     ? parseInt(prepEl.value, 10) || 0 : 0;

  if (typeof LOG === 'undefined') window.LOG = {};
  LOG[logId] = { html: logHtml, text: logRte ? (logRte.innerText||'').trim() : '',
    validatedByFac: !!(REF_DESCRIPTIONS && findDesc(a.atelier) && findDesc(a.atelier).validatedByFac),
    prepDuration: prepDur, updatedAt: today };

  if (typeof LOG_SPECIAL === 'undefined') window.LOG_SPECIAL = {};
  LOG_SPECIAL[logId] = { html: specHtml, text: logSpecRte ? (logSpecRte.innerText||'').trim() : '', updatedAt: today };

  if (typeof LOGISTICS_HELPERS === 'undefined') window.LOGISTICS_HELPERS = {};
  LOGISTICS_HELPERS[logId] = {
    avant:   avantRte   ? avantRte.innerHTML.trim()   : '',
    pendant: pendantRte ? pendantRte.innerHTML.trim()  : '',
    apres:   apresRte   ? apresRte.innerHTML.trim()    : '',
    updatedAt: today
  };

  try {
    await Promise.all([
      saveFile('logistics.js',         genererLogisticsJs()),
      saveFile('logistics.special.js', genererLogisticsSpecialJs()),
      saveFile('logistics.helpers.js', genererLogisticsHelpersJs()),
      saveFile('data.js',              genererDataJs()),
    ]);
    showToast('✅ Informations logistiques sauvegardées !');
  } catch(err) {
    showToast('❌ ' + err.message, true);
  } finally {
    if (ind) ind.classList.remove('show');
  }
}
window.saveLogistique = saveLogistique;

async function saveUpdate() {
  if (selectedIdx === null) return;
  const isNew = (selectedIdx === -1);

  const btn = document.getElementById('btnUpdate');
  const ind = document.getElementById('savingIndicator');
  if (btn) btn.disabled = true;
  if (ind) ind.classList.add('show');

  const newEntry = Object.assign({}, editedData);

  // Synchroniser la date depuis le jour si non remplie
  if (!newEntry.date && newEntry.jour) {
    const ref = REF_JOURS.find(j => j.value === newEntry.jour);
    if (ref) newEntry.date = ref.date;
  }

  // Types d'ateliers dont le champ angel est piloté par les shifts
  const TYPES_ANGEL_PILOTES = new Set([
    'ATELIERS TANTRA (Matin)', 'ATELIERS TANTRA (Apres-Midi)',
    'ATELIER ARTISTIQUE (Matin)', 'ATELIER ARTISTIQUE (Apres-Midi)',
    'LOVE TEMPLE', 'TANTRA CAFE & CONFERENCE',
    'SUPPORT EMOTIONNEL', 'CEREMONIE & CONCERT',
    'DJ Set', 'POOL PARTY',
  ]);

  // Pour les ateliers non-SHIFT ANGEL, calculer l'angel depuis le shift ANGEL correspondant
  if (newEntry.type !== 'SHIFT ANGEL') {
    if (TYPES_ANGEL_PILOTES.has(newEntry.type)) {
      newEntry.angel = resolveAngelEdit(newEntry.jour, newEntry.heure);
    } else {
      newEntry.angel = ''; // types non pilotés → angel toujours vide
    }
  }

  // ── Propagation en cascade : si on modifie un SHIFT ANGEL, mettre à jour
  //    le champ angel de tous les ateliers couverts sur le même jour ──────────
  function propagateShiftAngel(shiftEntry) {
    const shiftIv = (function(h) {
      const norm = String(h).replace(/\./g, ':').replace(/[–\u2013\u2014]/g, '-');
      const parts = norm.split(/\s*-+\s*/);
      const s = _parseHM(parts[0]);
      let e = parts[1] ? _parseHM(parts[1]) : null;
      if (s === null) return null;
      if (e !== null && e <= s) e += 1440;
      return { s, e: e ?? s + 180 };
    })(shiftEntry.heure);
    if (!shiftIv) return 0;

    let count = 0;
    AGENDA.forEach(function(entry) {
      if (entry === shiftEntry) return;
      if (entry.jour !== shiftEntry.jour) return;
      if (!TYPES_ANGEL_PILOTES.has(entry.type)) return;
      const norm = String(entry.heure).replace(/\./g, ':').replace(/[–\u2013\u2014]/g, '-');
      const parts = norm.split(/\s*-+\s*/);
      const aStart = _parseHM(parts[0]);
      if (aStart === null) return;
      if (aStart >= shiftIv.s && aStart < shiftIv.e) {
        entry.angel = shiftEntry.angel;
        count++;
      }
    });
    return count;
  }

  // ── Sauvegarder nomEn / consignes dans REF_DESCRIPTIONS si modifiés ─────────
  async function saveDescIfNeeded() {
    const hasDescChange = editedData._nomEn !== undefined || editedData._consigneFr !== undefined || editedData._consigneEn !== undefined;
    if (!hasDescChange) return;
    const atelierName = newEntry.atelier || '';
    let d = findDesc(atelierName);
    if (!d) {
      // Créer une entrée minimale
      const key = atelierName.toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,40);
      d = { key, atelier: atelierName, nomEn:'', type: newEntry.type||'', piment: newEntry.piment||0,
            fac1: newEntry.fac1||'', fac2: newEntry.fac2||'', descFr:'', descEn:'',
            consigne:'', consigneEn:'', validatedByFac:false, updatedAt:'' };
      REF_DESCRIPTIONS.push(d);
    }
    if (editedData._nomEn      !== undefined) d.nomEn      = editedData._nomEn;
    if (editedData._consigneFr !== undefined) d.consigne   = editedData._consigneFr;
    if (editedData._consigneEn !== undefined) d.consigneEn = editedData._consigneEn;
    d.updatedAt = new Date().toISOString().slice(0,10) + ' ' + new Date().toTimeString().slice(0,5);
    await saveFile('ref_descriptions.js', genererRefDescJs());
  }

  if (isNew) {
    // Ajouter en fin de tableau
    AGENDA.push(newEntry);
    const newIdx = AGENDA.length - 1;
    try {
      const content = genererDataJs();
      await sauvegarder(content);
      await saveDescIfNeeded();
      selectedIdx = newIdx;
      editedData  = Object.assign({}, newEntry);
      renderList();
      // Sélectionner la nouvelle ligne dans la liste
      document.querySelectorAll('.list-item').forEach(el => el.classList.remove('selected'));
      const li = document.getElementById('li-' + newIdx);
      if (li) { li.classList.add('selected'); li.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
      renderEditor();
      showToast('✅ Atelier créé avec succès !', false);
    } catch(err) {
      AGENDA.pop(); // rollback
      showToast('❌ Sauvegarde impossible : ' + err.message, true);
    } finally {
      if (btn) btn.disabled = false;
      if (ind) ind.classList.remove('show');
    }
  } else {
    const originalEntry = Object.assign({}, AGENDA[selectedIdx]);
    // Sauvegardes rollback des ateliers impactés (si SHIFT ANGEL)
    const rollbackAngels = [];
    AGENDA[selectedIdx] = newEntry;

    // Propagation cascade si c'est un SHIFT ANGEL
    let propagated = 0;
    if (newEntry.type === 'SHIFT ANGEL') {
      // Mémoriser l'état avant pour rollback
      AGENDA.forEach(function(entry, idx) {
        if (entry.jour === newEntry.jour && TYPES_ANGEL_PILOTES.has(entry.type)) {
          rollbackAngels.push({ idx, angel: entry.angel });
        }
      });
      propagated = propagateShiftAngel(newEntry);
    }

    try {
      const content = genererDataJs();
      await sauvegarder(content);
      await saveDescIfNeeded();
      renderList();
      const msg = propagated > 0
        ? `✅ data.js mis à jour — ${propagated} atelier(s) mis à jour avec angel : ${newEntry.angel}`
        : '✅ data.js mis à jour avec succès !';
      showToast(msg, false);
    } catch(err) {
      // Rollback
      AGENDA[selectedIdx] = originalEntry;
      rollbackAngels.forEach(function(rb) { AGENDA[rb.idx].angel = rb.angel; });
      showToast('❌ Sauvegarde impossible : ' + err.message, true);
      console.error('[Rapport11] Erreur saveUpdate:', err);
    } finally {
      if (btn) btn.disabled = false;
      if (ind) ind.classList.remove('show');
    }
  }
}
window.saveUpdate = saveUpdate;

// GÉNÉRATION data.js COMPLET (même format qu'Admin.html)
// ══════════════════════════════════════════════
function escJs(v) {
  return (v||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\r\n/g,'\\n').replace(/\r/g,'\\n').replace(/\n/g,'\\n');
}

function generateAtelierId() {
  let id = '';
  do {
    id = 'A_' + String(Math.floor(Math.random() * 10000)).padStart(4, '0');
  } while (AGENDA.some(e => e.id === id));
  return id;
}

function genererDataJs() {
  const header =
`/**
 * TANTRAMOUR 2026 — Référentiel de données commun
 * ================================================
 * Source unique pour les 3 rapports HTML.
 * Pour mettre à jour : modifier uniquement ce fichier.
 *
 * Structure de chaque entrée :
 *   jour       {string}  "Jour 1" … "Jour 7"
 *   date       {string}  "Samedi 29 aout" …
 *   heure      {string}  "9:45 - 11:00" | "Matin" | "APRES MIDI"
 *   type       {string}  catégorie (ex: "ATELIERS TANTRA (AM)")
 *   atelier    {string}  nom de l'atelier / activité
 *   lieu       {string}  salle / espace (ex: "SHIVA", "CHENREZIG" …)
 *   fac1       {string}  Animateur principal
 *   fac2       {string}  Animateur secondaire
 *   traduction {string}  Langue / traducteur
 *   helper1    {string}  Helper 1
 *   helper2    {string}  Helper 2
 *   helper3    {string}  Helper 3
 *   helper4    {string}  Helper 4
 *   angel      {string}  Angel
 *   note       {string}  Note logistique (ex: "Shift Colibri", "Atelier + long")
 *   colibri    {boolean} Vrai si un Colibri est requis pour cet atelier
 */

var AGENDA = [`;

  const lines = AGENDA.map((e, i) => {
    const prev = AGENDA[i - 1];
    let section = '';
    if (!prev || prev.jour !== e.jour) {
      const ref = (typeof REF_JOURS !== 'undefined') ? REF_JOURS.find(j => j.value === e.jour) : null;
      const dateLabel = ref ? ref.date : e.date;
      section = `\n  // ─── ${e.jour} — ${dateLabel} ${'─'.repeat(Math.max(0, 60 - e.jour.length - dateLabel.length))}\n`;
    }
    // Champs règles custom uniquement si différents du type
    const typeRule2 = (typeof REF_TYPES !== 'undefined') ? (REF_TYPES.find(t => t.value === e.type) || {}) : {};
    const customParts = [];
    if (e._minRes      !== undefined && e._minRes      !== (typeRule2.minRes||0))     customParts.push(`_minRes:${e._minRes}`);
    if (e._minHelpers  !== undefined && e._minHelpers  !== (typeRule2.minHelpers||0)) customParts.push(`_minHelpers:${e._minHelpers}`);
    if (e._minTrad     !== undefined && e._minTrad     !== (typeRule2.minTrad||0))    customParts.push(`_minTrad:${e._minTrad}`);
    if (e._tradCounts  !== undefined && e._tradCounts  !== (typeRule2.tradCounts||0)) customParts.push(`_tradCounts:${e._tradCounts}`);
    const line = `  {id:"${escJs(e.id || generateAtelierId())}",jour:"${escJs(e.jour)}",date:"${escJs(e.date)}",heure:"${escJs(e.heure)}",type:"${escJs(e.type)}",atelier:"${escJs(e.atelier)}",lieu:"${escJs(e.lieu)}",fac1:"${escJs(e.fac1)}",fac2:"${escJs(e.fac2)}",traduction:"${escJs(e.traduction)}",helper1:"${escJs(e.helper1)}",helper2:"${escJs(e.helper2)}",helper3:"${escJs(e.helper3)}",helper4:"${escJs(e.helper4||'')}",angel:"${escJs(e.angel)}",note:"${escJs(e.note)}",piment:${e.piment||0},colibri:${e.colibri?true:false},logisticId:"${escJs(e.logisticId||'')}"}`;
    const lineWithCustom = customParts.length
      ? line.slice(0, -1) + ',' + customParts.join(',') + '}'
      : line;
    const finalLine = lineWithCustom + ',';
    return section + finalLine;
  }).join('\n');

  return header + '\n' + lines + `
];

/**
 * Convertit un objet AGENDA en tableau positionnel [17 colonnes]
 * identique au format RAW utilisé par les rapports.
 * Indice : [0]jour [1]date [2]heure [3]type [4]atelier [5]lieu
 *          [6]fac1 [7]fac2 [8]traduction [9]helper1 [10]helper2
 *          [11]helper3 [12]helper4 [13]angel [14]note [15]logisticId [16]piment
 */
function agendaToRaw(entries) {
  return entries.map(e => [
    e.jour, e.date, e.heure, e.type, e.atelier, e.lieu,
    e.fac1, e.fac2, e.traduction,
    e.helper1, e.helper2, e.helper3, e.helper4 || '',
    e.angel, e.note, e.logisticId || '', e.piment || 0
  ]);
}`;
}

function genererRefDescJs() {
  const lines = (REF_DESCRIPTIONS||[]).map(d => {
    return '  { key:"'           + escJs(d.key||'') +
      '", atelier:"'             + escJs(d.atelier||'') +
      '", nomEn:"'               + escJs(d.nomEn||'') +
      '", type:"'                + escJs(d.type||'') +
      '", piment:'               + (d.piment||0) +
      ', fac1:"'                 + escJs(d.fac1||'') +
      '", fac2:"'                + escJs(d.fac2||'') +
      '", descFr:"'              + escJs(d.descFr||'') +
      '", descEn:"'              + escJs(d.descEn||'') +
      '", consigne:"'            + escJs(d.consigne||'') +
      '", consigneEn:"'          + escJs(d.consigneEn||'') +
      '", validatedByFac:'       + (d.validatedByFac ? 'true' : 'false') +
      ', updatedAt:"'            + escJs(d.updatedAt||'') + '" }';
  }).join(',\n');
  return '/**\n * TANTRAMOUR 2026 — Descriptions des Ateliers (FR / EN)\n' +
    ' * Géré automatiquement\n */\n\nvar REF_DESCRIPTIONS = [\n\n' + lines + '\n\n];\n';
}

// ══════════════════════════════════════════════
// GÉNÉRATION LOGISTICS.JS / SPECIAL / HELPERS
// ══════════════════════════════════════════════
function genererLogisticsJs() {
  const src = (typeof LOG !== 'undefined') ? LOG : {};
  const entries = Object.keys(src).map(k => {
    const v = src[k];
    const prep = (typeof v.prepDuration === 'number') ? v.prepDuration : 15;
    return `  "${escJs(k)}": {\n    html: "${escJs(v.html||'')}",\n    text: "${escJs(v.text||'')}",\n    validatedByFac: ${v.validatedByFac?'true':'false'},\n    prepDuration: ${prep},\n    updatedAt: "${escJs(v.updatedAt||'')}"\n  }`;
  }).join(',\n\n');
  return '/**\n * TANTRAMOUR 2026 — Informations Logistiques\n */\n\nvar LOGISTICS = {\n\n' + entries + (entries?'\n\n':'') + '};\n';
}

function genererLogisticsSpecialJs() {

  }).join(',\n\n');
  return '/**\n * TANTRAMOUR 2026 — Informations Logistiques Spéciales\n */\n\nvar LOGISTICS_SPECIAL = {\n\n' + entries + (entries?'\n\n':'') + '};\n';
}

function genererLogisticsHelpersJs() {
  const src = (typeof LOGISTICS_HELPERS !== 'undefined') ? LOGISTICS_HELPERS : {};
  const entries = Object.keys(src).map(k => {
    const v = src[k];
    return `  "${escJs(k)}": {\n    avant: "${escJs(v.avant||'')}",\n    pendant: "${escJs(v.pendant||'')}",\n    apres: "${escJs(v.apres||'')}",\n    updatedAt: "${escJs(v.updatedAt||'')}"\n  }`;
  }).join(',\n\n');
  return '/**\n * TANTRAMOUR 2026 — Consignes Helpers par Atelier\n * Structure : { avant, pendant, apres, updatedAt }\n */\n\nvar LOGISTICS_HELPERS = {\n\n' + entries + (entries?'\n\n':'') + '};\n';

// UTILITAIRES
// ══════════════════════════════════════════════
function esc(v) { return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function htmlToText(html) {
  if (!html) return '';
  var div = document.createElement('div');
  div.innerHTML = html;
  return (div.textContent || div.innerText || '').replace(/\s+\n/g, '\n').trim();
}

function buildAteliersExportRows() {
  return AGENDA.map(function(e) {
    var desc = findDesc(e.atelier) || {};
    var logId = e.logisticId || '';
    var logEntry = logId && typeof LOG !== 'undefined' ? LOG[logId] : null;
    var specEntry = logId && typeof LOG_SPECIAL !== 'undefined' ? LOG_SPECIAL[logId] : null;
    var helpEntry = logId && typeof LOGISTICS_HELPERS !== 'undefined' ? LOGISTICS_HELPERS[logId] : null;
    return {
      id: e.id || '',
      atelier: e.atelier || '',
      fac1: e.fac1 || '',
      fac2: e.fac2 || '',
      date: getExportDateValue(e),
      jour: e.jour || '',
      type: e.type || '',
      heureDebut: parseHeureDebut(e.heure || ''),
      heureFin: parseHeureFin(e.heure || ''),
      lieu: e.lieu || '',
      piment: e.piment || 0,
      note: e.note || '',
      nomEn: desc.nomEn || '',
      descFr: desc.descFr || '',
      descEn: desc.descEn || '',
      consigneFr: desc.consigne || '',
      consigneEn: desc.consigneEn || '',
      prepDuration: logEntry && logEntry.prepDuration !== undefined ? logEntry.prepDuration : '',
      logInfo: logEntry ? htmlToText(logEntry.html || logEntry.text || '') : '',
      logSpecial: specEntry ? htmlToText(specEntry.html || specEntry.text || '') : '',
      helperAvant: helpEntry ? htmlToText(helpEntry.avant || '') : '',
      helperPendant: helpEntry ? htmlToText(helpEntry.pendant || '') : '',
      helperApres: helpEntry ? htmlToText(helpEntry.apres || '') : ''
    };
  });
}

function escapeXml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatExportDate(dateStr) {
  if (!dateStr) return '';
  var match = String(dateStr).match(/(\d{1,2})\s+[A-Za-zéû\.]+\s+(\d{4})/);
  if (!match) return dateStr;
  var day = String(parseInt(match[1], 10)).padStart(2, '0');
  var year = match[2];
  var monthMap = {
    janvier:'01', fevrier:'02', février:'02', mars:'03', avril:'04', mai:'05', juin:'06', juillet:'07',
    aout:'08', août:'08', septembre:'09', octobre:'10', novembre:'11', decembre:'12', décembre:'12'
  };
  var monthKey = String(dateStr).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').match(/\d{1,2}\s+([a-z]+)\s+\d{4}/);
  var month = monthKey && monthMap[monthKey[1]] ? monthMap[monthKey[1]] : '';
  return month ? (day + '/' + month + '/' + year) : dateStr;
}

function getExportDateValue(entry) {
  var refJour = typeof REF_JOURS !== 'undefined'
    ? REF_JOURS.find(function(j) { return j.value === entry.jour; })
    : null;
  if (refJour && refJour.dateDdMmYyyy) return refJour.dateDdMmYyyy;
  return formatExportDate(entry.date || '');
}

function buildExcelRows(rows) {
  return rows.map(function(row) {
    return [
      row.id,row.atelier,row.fac1,row.fac2,row.type,row.date,row.jour,row.heureDebut,row.heureFin,row.lieu,row.piment,row.note,
      row.nomEn,row.descFr,row.descEn,row.consigneFr,row.consigneEn,row.prepDuration,row.logInfo,row.logSpecial,row.helperAvant,row.helperPendant,row.helperApres
    ];
  });
}

async function downloadExcelFile(rows, filename) {
  var workbook = new ExcelJS.Workbook();
  var sheet = workbook.addWorksheet('Ateliers');
  var headers = [
    'ID','Atelier (FR)','Animateur 1','Animateur 2','Type','Date (DD/MM/YYYY)','Jour','Heure de début','Heure de fin','Lieu','Piment','Note',
    'Workshop name (ENG)','Description (FR)','Description (ENG)','Instructions participants (FR)','Participant instructions (ENG)',
    'Estimation préparation','Informations logistiques','Besoins logistiques spécifiques','Consignes HELPER – AVANT','Consignes HELPER – PENDANT','Consignes HELPER – APRES'
  ];
  var grayColumns = { 11:true, 13:true, 14:true, 15:true, 16:true, 17:true, 18:true, 19:true, 20:true, 21:true, 22:true, 23:true };
  var columnWidths = [12, 30, 24, 24, 18, 14, 12, 14, 14, 16, 10, 18, 28, 36, 36, 36, 36, 20, 40, 40, 30, 30, 30];

  sheet.addRow(headers);
  buildExcelRows(rows).forEach(function(values) {
    sheet.addRow(values);
  });

  sheet.columns.forEach(function(column, index) {
    column.width = columnWidths[index] || 18;
  });
 
  sheet.autoFilter = {
    from: { row: 1, column: 1 },
    to: { row: 1, column: headers.length }
  };
  sheet.views = [{ state: 'frozen', xSplit: 2, ySplit: 1 }];

  sheet.getRow(1).eachCell(function(cell) {
    cell.font = { bold: true };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9EAF7' } };
    cell.border = {
      right: { style: 'dotted', color: { argb: 'FF9CA3AF' } },
      bottom: { style: 'thin', color: { argb: 'FFD1D5DB' } }
    };
  });

  sheet.eachRow(function(row, rowNumber) {
    if (rowNumber === 1) return;
    var baseColor = rowNumber % 2 === 0 ? 'FFFFFFFF' : 'FFF3F4F6';
    row.eachCell(function(cell, colNumber) {
      var fillColor = grayColumns[colNumber] ? 'FFE5E7EB' : baseColor;
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: fillColor } };
      cell.border = {
        right: { style: 'dotted', color: { argb: 'FF9CA3AF' } },
        bottom: { style: 'thin', color: { argb: 'FFE5E7EB' } }
      };
      cell.alignment = {
        vertical: 'top',
        wrapText: colNumber >= 13
      };
      if (colNumber === 6 && cell.value) {
        cell.numFmt = 'dd/mm/yyyy';
      }
    });
  });

  sheet.getColumn(6).eachCell(function(cell, rowNumber) {
    if (rowNumber === 1 || !cell.value) return;
    var parts = String(cell.value).split('/');
    if (parts.length === 3) {
      cell.value = new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
      cell.numFmt = 'dd/mm/yyyy';
    }
  });

  var buffer = await workbook.xlsx.writeBuffer();
  var blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  }).join(',\n\n');
  return '/**\n * TANTRAMOUR 2026 — Informations Logistiques\n * ===========================================\n * Structure : LOGISTICS = { "<logisticId>": { html, text, validatedByFac, prepDuration, updatedAt } }\n */\n\nvar LOGISTICS = {\n\n' +

      '    updatedAt: "' + escJs(e.updatedAt || '') + '"\n' +
      '  }';

}

      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: 'logistics.js', content: genererLogisticsJs() })
    });
    if (!res.ok) {
      var err = await res.json().catch(function(){return{};});
      throw new Error(err.error || 'Erreur ' + res.status);
    }
    return;
  }
  await githubSaveFile('logistics.js', genererLogisticsJs());
}

async function logSpecialSauvegarder() {
  if (location.protocol === 'file:') {
    throw new Error('Ouvrez via http://localhost:3000 (lancez start.bat) pour sauvegarder.');
  }
  var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (isLocal) {
    var res = await fetch('http://localhost:3000/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: 'logistics.special.js', content: genererLogisticsSpecialJs() })
    });
    if (!res.ok) {
      var err = await res.json().catch(function(){return{};});
      throw new Error(err.error || 'Erreur ' + res.status);
    }
    return;
  }
  await githubSaveFile('logistics.special.js', genererLogisticsSpecialJs());
}

// ══════════════════════════════════════════════════════
// SECTION LOGISTIQUE SPÉCIALE — liée à l'atelier sélectionné
// ══════════════════════════════════════════════════════

function logSpecialRenderForAtelier(logId) {
  var sec = document.getElementById('logSpecialSection');
  if (!sec) return;

  if (!LOG_SPECIAL[logId]) {
    sec.innerHTML =
      '<div style="padding:16px;background:var(--surface);border:1px dashed #c4b5fd;border-radius:8px;text-align:center;">' +
        '<div style="color:var(--muted);font-size:13px;margin-bottom:12px;">Aucune information logistique spéciale pour cet atelier.</div>' +
        '<button class="btn-primary" style="font-size:13px;padding:7px 18px;background:#7c5cd8;border-color:#7c5cd8" onclick="logSpecialCreer()">＋ Créer les informations logistiques spéciales</button>' +
      '</div>';
    return;
  }

  var entry  = LOG_SPECIAL[logId];
  var toolbar = [
    '<div class="rte-toolbar">',
      '<button class="rte-btn" onclick="rteCmd(\'log-special-rte\',\'bold\')"><b>B</b></button>',
      '<button class="rte-btn" onclick="rteCmd(\'log-special-rte\',\'italic\')"><i>I</i></button>',
      '<button class="rte-btn" onclick="rteCmd(\'log-special-rte\',\'underline\')"><u>U</u></button>',
      '<div class="rte-sep"></div>',
      '<button class="rte-btn" onclick="rteCmd(\'log-special-rte\',\'insertUnorderedList\')">• Liste</button>',
      '<button class="rte-btn" onclick="rteCmd(\'log-special-rte\',\'insertOrderedList\')">1. Liste</button>',
      '<div class="rte-sep"></div>',
      '<button class="rte-btn" onclick="rteCmd(\'log-special-rte\',\'removeFormat\')">✖ Format</button>',
    '</div>',
  ].join('');

  sec.innerHTML =
    '<div id="log-special-preview" class="logistics-html-preview" style="padding:10px 0 14px">' +
      (entry.html || '<em style="color:var(--muted)">Aucun contenu.</em>') +
    '</div>' +
    '<div id="log-special-editzone" class="logistics-edit-zone">' +
      toolbar +
      '<div class="rte-editor" id="log-special-rte" contenteditable="true" style="border-color:#c4b5fd">' + (entry.html || '') + '</div>' +
      '<div class="logistics-edit-actions">' +
        '<button class="btn-success" style="background:#7c5cd8;border-color:#7c5cd8;color:#fff" onclick="logSpecialSaveEntry()">✅ Sauvegarder</button>' +
        '<button class="btn-secondary" onclick="logSpecialCancelEdit()">✖ Annuler</button>' +
        '<button class="btn-danger" style="margin-left:auto" onclick="logSpecialSupprimerEntree()">🗑 Supprimer</button>' +
        '<div class="logistics-saving" id="logspecialsavind"><div class="spinner"></div> Sauvegarde…</div>' +
      '</div>' +
    '</div>' +
    '<div id="log-special-actions" style="display:flex;gap:8px;margin-top:10px;">' +
      '<button class="btn" style="border-color:#c4b5fd;color:#7c5cd8" onclick="logSpecialOuvrirEdition()">✏️ Modifier</button>' +
    '</div>';
}

function logSpecialCreer() {
  if (selectedIdx === null) return;
  var a = AGENDA[selectedIdx];
  var logId = a.logisticId;

  // Si l'atelier n'a pas encore de logisticId, en générer un et le lier
  if (!logId) {
    var base = ('LOG_' + (a.jour || '').replace(/\s/g,'') + '_' + (a.atelier || 'NEW').replace(/[^A-Za-z0-9]/g,'_').toUpperCase()).slice(0, 40);
    var newId = base, n = 2;
    while (LOG[newId] || LOG_SPECIAL[newId]) { newId = base + '_' + n; n++; }
    logId = newId;
    editedData.logisticId = logId;
    AGENDA[selectedIdx].logisticId = logId;
    // Sauvegarder data.js pour persister le lien
    sauvegarder(genererDataJs()).catch(function(err) {
      showToast('❌ Impossible de lier l\'ID : ' + err.message, true);
    });
  }

  LOG_SPECIAL[logId] = { html: '', text: '', updatedAt: new Date().toISOString().slice(0,10) };

  logSpecialRenderForAtelier(logId);
  logSpecialOuvrirEdition();
}
window.logSpecialCreer = logSpecialCreer;

function logSpecialOuvrirEdition() {
  var preview  = document.getElementById('log-special-preview');
  var editzone = document.getElementById('log-special-editzone');
  var actions  = document.getElementById('log-special-actions');
  if (preview)  preview.style.display  = 'none';
  if (editzone) editzone.classList.add('active');
  if (actions)  actions.style.display  = 'none';
  var rte = document.getElementById('log-special-rte');
  if (rte) { rte.focus(); placeCursorAtEnd(rte); }
}
window.logSpecialOuvrirEdition = logSpecialOuvrirEdition;

function logSpecialCancelEdit() {
  var preview  = document.getElementById('log-special-preview');
  var editzone = document.getElementById('log-special-editzone');
  var actions  = document.getElementById('log-special-actions');
  if (preview)  preview.style.display  = '';
  if (editzone) editzone.classList.remove('active');
  if (actions)  actions.style.display  = '';
}
window.logSpecialCancelEdit = logSpecialCancelEdit;

async function logSpecialSaveEntry() {
  if (selectedIdx === null) return;
  var logId = (editedData && editedData.logisticId) || AGENDA[selectedIdx].logisticId;
  if (!logId) return;

  var rte     = document.getElementById('log-special-rte');
  var newHtml = rte ? rte.innerHTML.trim() : '';
  var tmp = document.createElement('div');
  tmp.innerHTML = newHtml;
  var newText = (tmp.textContent || tmp.innerText || '').trim();

  LOG_SPECIAL[logId] = { html: newHtml, text: newText, updatedAt: new Date().toISOString().slice(0,10) };

  var ind = document.getElementById('logspecialsavind');
  if (ind) ind.classList.add('show');
  try {
    await logSpecialSauvegarder();
    showToast('✅ Informations logistiques spéciales sauvegardées !');
    var preview = document.getElementById('log-special-preview');
    if (preview) preview.innerHTML = newHtml || '<em style="color:var(--muted)">Aucun contenu.</em>';
    logSpecialCancelEdit();
  } catch(err) {
    showToast('❌ Sauvegarde impossible : ' + err.message, true);
  } finally {
    if (ind) ind.classList.remove('show');
  }
}
window.logSpecialSaveEntry = logSpecialSaveEntry;

async function logSpecialSupprimerEntree() {
  if (selectedIdx === null) return;
  var logId = AGENDA[selectedIdx].logisticId;
  if (!logId) return;
  if (!confirm('Supprimer les informations logistiques spéciales de cet atelier ?')) return;

  delete LOG_SPECIAL[logId];

  var ind = document.getElementById('logSpecialSaving');
  if (ind) ind.classList.add('show');
  try {
    await logSpecialSauvegarder();
    showToast('🗑 Informations logistiques spéciales supprimées.');
    logSpecialRenderForAtelier(logId);
  } catch(err) {
    showToast('❌ Suppression impossible : ' + err.message, true);
  } finally {
    if (ind) ind.classList.remove('show');
  }
}
window.logSpecialSupprimerEntree = logSpecialSupprimerEntree;

}); // fin loadData
</script>
